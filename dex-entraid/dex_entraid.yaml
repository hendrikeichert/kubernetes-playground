---
apiVersion: v1
kind: Namespace
metadata:
  name: entraid
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: entraid
  name: entraid
  namespace: entraid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: entraid
  template:
    metadata:
      labels:
        app: entraid
    spec:
      serviceAccountName: entraid # This is created below
      containers:
      - image: ghcr.io/dexidp/dex:v2.32.0
        name: entraid
        command: ["/usr/local/bin/dex", "serve", "/etc/dex/cfg/config.yaml"]

        ports:
        - name: https
          containerPort: 5556

        volumeMounts:
        - name: config
          mountPath: /etc/dex/cfg
        - name: tls
          mountPath: /etc/dex/tls

        env:
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: github-client
              key: client-id
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: github-client
              key: client-secret

        readinessProbe:
          httpGet:
            path: /healthz
            port: 5556
            scheme: HTTPS
      volumes:
      - name: config
        configMap:
          name: entraid
          items:
          - key: config.yaml
            path: config.yaml
      - name: tls
        secret:
          secretName: entraid.example.com.tls
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: entraid
  namespace: entraid
data:
  # realm -> entraid
  # keycloak -> keycloak.keycloak.svc.cluster.local
  config.yaml: |
    issuer: https://entraid.example.com:32000      
    storage:
      type: kubernetes
      config:
        inCluster: true
    web:
      http: 0.0.0.0:5556
    connectors:
    - type: mockPassword
      id: mock
      name: Mock Entra ID
      config:
        users:
        - email: user@example.com
          username: myuser
          password: mypassword
    oauth2:
      skipApprovalScreen: true
    staticClients:
    - id: keycloak
      secret: "clientSecret"
      name: Keycloak
      redirectURIs:
      - http://keycloak.keycloak.svc.cluster.local/auth/realms/entraid/broker/dex/endpoint
---
apiVersion: v1
kind: Service
metadata:
  name: entraid
  namespace: entraid
spec:
  type: NodePort
  ports:
  - name: entraid
    port: 5556
    protocol: TCP
    targetPort: 5556
    nodePort: 32000
  selector:
    app: entraid
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app: entraid
  name: entraid
  namespace: entraid
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: entraid
rules:
- apiGroups: ["dex.coreos.com"] # API group created by dex
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["create"] # To manage its own resources, dex must be able to create customresourcedefinitions
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: entraid
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: entraid
subjects:
- kind: ServiceAccount
  name: entraid           # Service account assigned to the dex pod, created above
  namespace: entraid  # The namespace dex is running in
---
apiVersion: v1
kind: Secret
metadata:
  name: entraid.example.com.tls
  namespace: entraid
type: Opaque
data:
  tls.crt: ""
  tls.key: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: github-client
  namespace: entraid
type: Opaque
data:
  client-id: "test"
  client-secret: "test"
