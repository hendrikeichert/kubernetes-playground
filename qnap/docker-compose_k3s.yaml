services:
  server:
    image: rancher/k3s:v1.30.14-k3s2  # Change this tag for updates (e.g., v1.30.3-k3s1 for latest stable as of now)
    command:
    - "server"
    - "--config"
    - "/etc/rancher/config.yaml"            
    tmpfs:
    - /run
    - /var/run
    privileged: true
    restart: unless-stopped
    environment:
    - K3S_TOKEN=85c1eb2160f787c60f6a12cb452fd333  # Generate a secure token (e.g., openssl rand -hex 16)
    - K3S_KUBECONFIG_OUTPUT=/output/kubeconfig.yaml
    - "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/bin/aux"
    - "CRI_CONFIG_FILE=/var/lib/rancher/k3s/agent/etc/crictl.yaml"
    volumes:
    - /share/CACHEDEV1_DATA/.qpkg/container-station/var/lib/k3s/var/lib/cni:/var/lib/cni
    - /share/CACHEDEV1_DATA/.qpkg/container-station/var/lib/k3s/etc/rancher:/etc/rancher
    - /share/CACHEDEV1_DATA/.qpkg/container-station/var/lib/k3s/var/lib/kubelet:/var/lib/kubelet
    - /share/CACHEDEV1_DATA/.qpkg/container-station/var/lib/k3s/var/lib/rancher/k3s:/var/lib/rancher/k3s
    - /share/CACHEDEV1_DATA/.qpkg/container-station/etc/k3s:/etc/k3s
    - /share/CACHEDEV1_DATA/.qpkg/container-station/var/log/container-station/k3s:/var/log
    - /share/CACHEDEV2_DATA/VMs/container-station-data/application/k3s/output:/output
    ports:
    - 6443:6443  # Kubernetes API
    - 61000-62000:61000-62000  # NodePort range
    - 8000:8000
    - 9443:9443
    labels:
      com.qnap.kubernetes: "True"  # Tricks Container Station into recognizing/managing it for kubeconfig download
volumes:
  k3s-server:
