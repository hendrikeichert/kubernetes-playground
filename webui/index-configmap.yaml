apiVersion: v1
kind: ConfigMap
metadata:
  name: webui-index-html
  namespace: webui
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Kubernetes WebUI</title>
        <style>
          * { box-sizing: border-box; }
          body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: grid;
            grid-template-columns: 260px 1fr;
          }
          .menu {
            border-right: 1px solid #d7d7d7;
            padding: 16px;
            background: #f8f9fb;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
          }
          .menu h1 {
            margin: 0 0 16px;
            font-size: 18px;
          }
          .menu details {
            margin-bottom: 8px;
          }
          .menu summary {
            list-style: none;
            cursor: pointer;
            padding: 10px 12px;
            margin-bottom: 8px;
            border: 1px solid #d7d7d7;
            border-radius: 6px;
            color: #1a1a1a;
            background: #f1f4f8;
            font-weight: 600;
          }
          .menu summary::-webkit-details-marker {
            display: none;
          }
          .menu .tree-leaf {
            display: block;
            padding: 10px 12px;
            margin-bottom: 8px;
            border: 1px solid #d7d7d7;
            border-radius: 6px;
            color: #1a1a1a;
            text-decoration: none;
            background: #fff;
            margin-left: 12px;
          }
          .menu .tree-leaf:hover {
            background: #eef4ff;
          }
          .menu .tree-leaf.active {
            background: #dde9ff;
            border-color: #9db7ff;
          }
          .content {
            height: 100vh;
          }
          iframe {
            width: 100%;
            height: 100%;
            border: 0;
          }
        </style>
      </head>
      <body>
        <aside class="menu">
          <h1>WebUI</h1>
          <details open>
            <summary>Databases</summary>
            <a class="tree-leaf" href="#" data-target="__adminer_pg__">Adminer Preset: PostgreSQL</a>
            <a class="tree-leaf" href="#" data-target="__adminer_mongo__">Adminer Preset: MongoDB</a>
            <a class="tree-leaf" href="#" data-target="__adminer_es__">Adminer Preset: Elasticsearch</a>
            <a class="tree-leaf" href="#" data-target="__es_test__">Elasticsearch Test</a>
          </details>
          <details open>
            <summary>Camunda</summary>
            <a class="tree-leaf" href="#" data-target="/camunda/operate">Camunda Operate</a>
            <a class="tree-leaf" href="#" data-target="/camunda/tasklist">Camunda Tasklist</a>
            <a class="tree-leaf" href="#" data-target="/camunda/identity">Camunda Identity</a>
          </details>
          <details open>
            <summary>Identity & Access</summary>
            <a class="tree-leaf" href="#" data-target="/keycloak/">Keycloak</a>
            <a class="tree-leaf" href="#" data-target="/dex/.well-known/openid-configuration">Dex Well-Known (OIDC Discovery)</a>
            <a class="tree-leaf" href="#" data-target="/dex/auth?client_id=example-app&redirect_uri=http%3A%2F%2F127.0.0.1%3A5555%2Fcallback&response_type=code&scope=openid&state=webui&nonce=webui">Dex Login</a>
          </details>          
          <details open>
            <summary>Dashboard</summary>
            <a class="tree-leaf" href="#" data-target="__health__">Service Health Dashboard</a>
            <a class="tree-leaf" href="#" data-target="__pod_status__">Pod Status</a>
            <a class="tree-leaf" href="#" data-target="__config__">Service Configuration</a>
            <a class="tree-leaf" href="#" data-target="/dashboard-api/swagger">Dashboard API Swagger</a>
          </details>
          <details open>
            <summary>Streaming</summary>
            <a class="tree-leaf" href="#" data-target="/redpanda/">Redpanda Console WebUI</a>
            <a class="tree-leaf" href="#" data-target="/kafka-connect/">Kafka Connect REST API</a>
          </details>
          <details open>
            <summary>Observability</summary>
            <a class="tree-leaf" href="#" data-target="/prometheus/">Prometheus UI</a>
            <a class="tree-leaf" href="#" data-target="/grafana/">Grafana UI</a>
          </details>
        </aside>
        <main class="content">
          <iframe id="viewer" src="/adminer/" title="Selected page"></iframe>
        </main>

        <script>
          const viewer = document.getElementById('viewer');
          const links = document.querySelectorAll('.menu [data-target]');

          function escapeHtml(value) {
            return String(value)
              .replaceAll('&', '&amp;')
              .replaceAll('<', '&lt;')
              .replaceAll('>', '&gt;')
              .replaceAll('"', '&quot;')
              .replaceAll("'", '&#39;');
          }

          function safeNumber(value) {
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : 0;
          }

          function formatCpuMilli(value) {
            const milli = safeNumber(value);
            if (milli >= 1000) {
              return `${(milli / 1000).toFixed(2)} cores (${Math.round(milli)}m)`;
            }
            return `${Math.round(milli)}m`;
          }

          function formatBytes(value) {
            const bytes = safeNumber(value);
            const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];
            let scaled = bytes;
            let unitIndex = 0;
            while (scaled >= 1024 && unitIndex < units.length - 1) {
              scaled /= 1024;
              unitIndex += 1;
            }
            const precision = scaled >= 10 || unitIndex === 0 ? 1 : 2;
            return `${scaled.toFixed(precision)} ${units[unitIndex]}`;
          }

          function toPercent(value, limit) {
            if (limit <= 0) {
              return 0;
            }
            const pct = (value / limit) * 100;
            return Math.max(0, Math.min(100, pct));
          }

          function formatPercent(value, limit) {
            if (safeNumber(limit) <= 0) {
              return 'n/a';
            }
            return `${toPercent(value, limit).toFixed(1)}%`;
          }

          function renderResourceBar(label, usageValue, requestValue, limitValue, usageText, requestText, limitText) {
            const current = safeNumber(usageValue);
            const request = safeNumber(requestValue);
            const limit = safeNumber(limitValue);

            if (limit <= 0) {
              return `
                <div style="margin-bottom:8px;">
                  <div style="font-size:12px;font-weight:bold;">${escapeHtml(label)}: no limit</div>
                  <div style="font-size:12px;color:#666;">Current ${escapeHtml(usageText || 'n/a')} | Request ${escapeHtml(requestText || 'n/a')} | Limit n/a</div>
                </div>
              `;
            }

            const currentPct = toPercent(current, limit);
            const requestPct = toPercent(request, limit);

            return `
              <div style="margin-bottom:8px;">
                <div style="font-size:12px;font-weight:bold;">${escapeHtml(label)}</div>
                <div style="position:relative;height:14px;background:#f2f4f7;border:1px solid #f59e0b;border-radius:4px;overflow:hidden;">
                  <div style="position:absolute;left:0;top:0;bottom:0;width:${requestPct}%;background:#3b82f6;opacity:0.55;"></div>
                  <div style="position:absolute;left:0;top:0;bottom:0;width:${currentPct}%;background:#22c55e;opacity:0.8;"></div>
                  <div style="position:absolute;right:0;top:0;bottom:0;width:2px;background:#f59e0b;"></div>
                </div>
                <div style="font-size:12px;color:#666;">Current ${escapeHtml(usageText || 'n/a')} | Request ${escapeHtml(requestText || 'n/a')} | Limit ${escapeHtml(limitText || 'n/a')}</div>
              </div>
            `;
          }

          function setActiveLink(activeLink) {
            links.forEach((link) => link.classList.remove('active'));
            if (activeLink) {
              activeLink.classList.add('active');
            }
          }

          async function checkService(service) {
            try {
              const response = await fetch(service.url, { method: 'GET', redirect: 'follow' });
              if (!response.ok) {
                return { status: `HTTP ${response.status}` };
              }

              if (service.type === 'dashboard-api') {
                try {
                  const payload = await response.json();
                  if (service.name === 'Elasticsearch Service') {
                    const cluster = payload?.details?.clusterStatus ? ` (${payload.details.clusterStatus})` : '';
                    return { status: `${payload.status}${cluster}` };
                  }
                  return { status: payload.status || 'UP' };
                } catch (error) {
                  return { status: 'UP' };
                }
              }

              if (service.name === 'Elasticsearch Service') {
                try {
                  const payload = await response.json();
                  const cluster = payload.status ? ` (${payload.status})` : '';
                  return { status: `UP${cluster}` };
                } catch (error) {
                  return { status: 'UP' };
                }
              }

              if (service.name === 'PostgreSQL Service') {
                return { status: 'UP (via Adminer)' };
              }

              return { status: 'UP' };
            } catch (error) {
              return { status: 'DOWN' };
            }
          }

          async function showHealthDashboard() {
            const services = [
              { name: 'Adminer UI', url: '/adminer/' },
              { name: 'PostgreSQL Service', url: '/dashboard-api/health/postgres', type: 'dashboard-api' },
              { name: 'MongoDB Service', url: '/dashboard-api/health/mongodb', type: 'dashboard-api' },
              { name: 'Elasticsearch Service', url: '/dashboard-api/health/elasticsearch', type: 'dashboard-api' },
              { name: 'Confluent Kafka', url: '/dashboard-api/health/kafka', type: 'dashboard-api' },
              { name: 'Confluent Schema Registry', url: '/dashboard-api/health/schema-registry', type: 'dashboard-api' },
              { name: 'Redpanda Console', url: '/dashboard-api/health/redpanda-console', type: 'dashboard-api' },
              { name: 'Kafka Connect', url: '/dashboard-api/health/kafka-connect', type: 'dashboard-api' },
              { name: 'OTel Collector Service', url: '/dashboard-api/health/otel', type: 'dashboard-api' },
              { name: 'Prometheus Service', url: '/dashboard-api/health/prometheus', type: 'dashboard-api' },
              { name: 'Grafana Service', url: '/dashboard-api/health/grafana', type: 'dashboard-api' },
              { name: 'Camunda Operate', url: '/camunda/operate' },
              { name: 'Camunda Tasklist', url: '/camunda/tasklist' },
              { name: 'Camunda Identity', url: '/camunda/identity' },
              { name: 'Keycloak', url: '/keycloak/' },
              { name: 'Dex Service', url: '/dashboard-api/health/dex', type: 'dashboard-api' },
            ];

            const results = await Promise.all(
              services.map(async (service) => ({
                ...service,
                ...(await checkService(service))
              }))
            );

            const rows = results
              .map((service) => {
                const color =
                  service.status.startsWith('UP')
                    ? '#1f8b24'
                    : '#b42318';
                const linkCell = `<a href="${escapeHtml(service.url)}" target="_self">${escapeHtml(service.url)}</a>`;
                return `
                  <tr>
                    <td style="padding:8px;border-bottom:1px solid #eee;">${escapeHtml(service.name)}</td>
                    <td style="padding:8px;border-bottom:1px solid #eee;">${linkCell}</td>
                    <td style="padding:8px;border-bottom:1px solid #eee;color:${color};font-weight:bold;">${escapeHtml(service.status)}</td>
                  </tr>
                `;
              })
              .join('');

            viewer.srcdoc = `
              <!doctype html>
              <html lang="en">
              <head><meta charset="UTF-8" /><title>Service Health Dashboard</title></head>
              <body style="font-family:Arial,sans-serif;padding:16px;">
                <h2 style="margin-top:0;">Service Health Dashboard</h2>
                <table style="width:100%;border-collapse:collapse;">
                  <thead>
                    <tr>
                      <th style="text-align:left;padding:8px;border-bottom:2px solid #ddd;">Service</th>
                      <th style="text-align:left;padding:8px;border-bottom:2px solid #ddd;">URL</th>
                      <th style="text-align:left;padding:8px;border-bottom:2px solid #ddd;">Status</th>
                    </tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>
              </body>
              </html>
            `;
          }

          async function showElasticsearchTest() {
            const checks = [
              { name: 'Ingress Root', url: '/elasticsearch/' },
              { name: 'Cluster Health', url: '/elasticsearch/_cluster/health' }
            ];

            const results = await Promise.all(
              checks.map(async (check) => {
                try {
                  const response = await fetch(check.url, { method: 'GET', redirect: 'follow' });
                  const responseText = await response.text();
                  const preview = responseText.length > 240
                    ? `${responseText.slice(0, 240)}...`
                    : responseText;
                  return {
                    ...check,
                    status: response.ok ? 'UP' : `HTTP ${response.status}`,
                    preview
                  };
                } catch (error) {
                  return {
                    ...check,
                    status: 'DOWN',
                    preview: ''
                  };
                }
              })
            );

            const rows = results
              .map((result) => {
                const color = result.status === 'UP' ? '#1f8b24' : '#b42318';
                return `
                  <tr>
                    <td style="padding:8px;border-bottom:1px solid #eee;">${escapeHtml(result.name)}</td>
                    <td style="padding:8px;border-bottom:1px solid #eee;"><a href="${escapeHtml(result.url)}" target="_self">${escapeHtml(result.url)}</a></td>
                    <td style="padding:8px;border-bottom:1px solid #eee;color:${color};font-weight:bold;">${escapeHtml(result.status)}</td>
                    <td style="padding:8px;border-bottom:1px solid #eee;font-family:monospace;white-space:pre-wrap;word-break:break-word;">${escapeHtml(result.preview)}</td>
                  </tr>
                `;
              })
              .join('');

            viewer.srcdoc = `
              <!doctype html>
              <html lang="en">
              <head><meta charset="UTF-8" /><title>Elasticsearch Test</title></head>
              <body style="font-family:Arial,sans-serif;padding:16px;">
                <h2 style="margin-top:0;">Elasticsearch Test</h2>
                <p>Ingress endpoint: <a href="/elasticsearch/" target="_self">/elasticsearch/</a></p>
                <table style="width:100%;border-collapse:collapse;">
                  <thead>
                    <tr>
                      <th style="text-align:left;padding:8px;border-bottom:2px solid #ddd;">Check</th>
                      <th style="text-align:left;padding:8px;border-bottom:2px solid #ddd;">URL</th>
                      <th style="text-align:left;padding:8px;border-bottom:2px solid #ddd;">Status</th>
                      <th style="text-align:left;padding:8px;border-bottom:2px solid #ddd;">Response Preview</th>
                    </tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>
              </body>
              </html>
            `;
          }

          async function showPodStatus() {
            try {
              const response = await fetch('/dashboard-api/pod-status', { method: 'GET', redirect: 'follow' });
              if (!response.ok) {
                viewer.srcdoc = `
                  <!doctype html>
                  <html lang="en">
                  <head><meta charset="UTF-8" /><title>Pod Status</title></head>
                  <body style="font-family:Arial,sans-serif;padding:16px;">
                    <h2 style="margin-top:0;">Pod Status</h2>
                    <p style="color:#b42318;font-weight:bold;">Failed to load pod status: HTTP ${response.status}</p>
                  </body>
                  </html>
                `;
                return;
              }

              const payload = await response.json();
              const services = Array.isArray(payload.services) ? payload.services : [];
              const totalCpuUsageMilli = services.reduce(
                (sum, service) => sum + safeNumber(service.cpuUsageMilli),
                0
              );
              const totalCpuRequestMilli = services.reduce(
                (sum, service) => sum + safeNumber(service.cpuRequestMilli),
                0
              );
              const totalCpuLimitMilli = services.reduce(
                (sum, service) => sum + safeNumber(service.cpuLimitMilli),
                0
              );
              const totalMemoryUsageBytes = services.reduce(
                (sum, service) => sum + safeNumber(service.memoryUsageBytes),
                0
              );
              const totalMemoryRequestBytes = services.reduce(
                (sum, service) => sum + safeNumber(service.memoryRequestBytes),
                0
              );
              const totalMemoryLimitBytes = services.reduce(
                (sum, service) => sum + safeNumber(service.memoryLimitBytes),
                0
              );
              const totalCpuCurrentPct = formatPercent(totalCpuUsageMilli, totalCpuLimitMilli);
              const totalCpuRequestPct = formatPercent(totalCpuRequestMilli, totalCpuLimitMilli);
              const totalMemoryCurrentPct = formatPercent(totalMemoryUsageBytes, totalMemoryLimitBytes);
              const totalMemoryRequestPct = formatPercent(totalMemoryRequestBytes, totalMemoryLimitBytes);

              const rows = services
                .map((service) => {
                  const status = service.status || 'UNKNOWN';
                  const color = status === 'UP' ? '#1f8b24' : status === 'DEGRADED' ? '#b26a00' : '#b42318';
                  const pods = Array.isArray(service.pods) ? service.pods : [];
                  const cpuBar = renderResourceBar(
                    'CPU',
                    service.cpuUsageMilli,
                    service.cpuRequestMilli,
                    service.cpuLimitMilli,
                    service.cpuUsage || 'n/a',
                    service.cpuRequest || 'n/a',
                    service.cpuLimit || 'n/a'
                  );
                  const memoryBar = renderResourceBar(
                    'Memory',
                    service.memoryUsageBytes,
                    service.memoryRequestBytes,
                    service.memoryLimitBytes,
                    service.memoryUsage || 'n/a',
                    service.memoryRequest || 'n/a',
                    service.memoryLimit || 'n/a'
                  );
                  const podDetails = pods.length === 0
                    ? '<em>no pods</em>'
                    : pods
                        .map((pod) => `${escapeHtml(pod.name)} [${escapeHtml(pod.phase)} | ${pod.readyContainers}/${pod.totalContainers} ready | CPU ${escapeHtml(pod.cpuUsage || 'n/a')} (req ${escapeHtml(pod.cpuRequest || 'n/a')}, lim ${escapeHtml(pod.cpuLimit || 'n/a')}) | MEM ${escapeHtml(pod.memoryUsage || 'n/a')} (req ${escapeHtml(pod.memoryRequest || 'n/a')}, lim ${escapeHtml(pod.memoryLimit || 'n/a')}) | restarts ${pod.restartCount}]`)
                        .join('<br/>');

                  return `
                    <tr>
                      <td style="padding:8px;border-bottom:1px solid #eee;">${escapeHtml(service.service || 'unknown')}</td>
                      <td style="padding:8px;border-bottom:1px solid #eee;">${escapeHtml(service.namespace || '-')}</td>
                      <td style="padding:8px;border-bottom:1px solid #eee;min-width:330px;">${cpuBar}${memoryBar}</td>
                      <td style="padding:8px;border-bottom:1px solid #eee;color:${color};font-weight:bold;">${escapeHtml(status)}</td>
                      <td style="padding:8px;border-bottom:1px solid #eee;">${escapeHtml(String(service.readyPods ?? 0))}/${escapeHtml(String(service.totalPods ?? 0))}</td>
                      <td style="padding:8px;border-bottom:1px solid #eee;font-family:monospace;white-space:pre-wrap;word-break:break-word;">${podDetails}</td>
                    </tr>
                  `;
                })
                .join('');

              viewer.srcdoc = `
                <!doctype html>
                <html lang="en">
                <head><meta charset="UTF-8" /><title>Pod Status</title></head>
                <body style="font-family:Arial,sans-serif;padding:16px;">
                  <h2 style="margin-top:0;">Pod Status</h2>
                  <p><strong>Overall:</strong> ${escapeHtml(payload.status || 'UNKNOWN')}</p>
                  <div style="margin:12px 0 14px;padding:10px 12px;border:1px solid #ddd;border-radius:6px;background:#f8f9fb;">
                    <div style="font-size:13px;font-weight:bold;margin-bottom:4px;">Total Pod Usage</div>
                    <div style="font-size:13px;color:#333;">CPU Current: <strong>${escapeHtml(formatCpuMilli(totalCpuUsageMilli))}</strong> (${escapeHtml(totalCpuCurrentPct)}) | Request: <strong>${escapeHtml(formatCpuMilli(totalCpuRequestMilli))}</strong> (${escapeHtml(totalCpuRequestPct)}) | Limit: <strong>${escapeHtml(formatCpuMilli(totalCpuLimitMilli))}</strong></div>
                    <div style="font-size:13px;color:#333;margin-top:4px;">Memory Current: <strong>${escapeHtml(formatBytes(totalMemoryUsageBytes))}</strong> (${escapeHtml(totalMemoryCurrentPct)}) | Request: <strong>${escapeHtml(formatBytes(totalMemoryRequestBytes))}</strong> (${escapeHtml(totalMemoryRequestPct)}) | Limit: <strong>${escapeHtml(formatBytes(totalMemoryLimitBytes))}</strong></div>
                  </div>
                  <p style="font-size:12px;color:#444;">
                    <span style="display:inline-block;width:10px;height:10px;background:#3b82f6;vertical-align:middle;margin-right:4px;"></span>Request
                    &nbsp;&nbsp;
                    <span style="display:inline-block;width:10px;height:10px;background:#22c55e;vertical-align:middle;margin-right:4px;"></span>Current
                    &nbsp;&nbsp;
                    <span style="display:inline-block;width:10px;height:10px;background:#f59e0b;vertical-align:middle;margin-right:4px;"></span>Limit
                  </p>
                  <table style="width:100%;border-collapse:collapse;">
                    <thead>
                      <tr>
                        <th style="text-align:left;padding:8px;border-bottom:2px solid #ddd;">Service</th>
                        <th style="text-align:left;padding:8px;border-bottom:2px solid #ddd;">Namespace</th>
                        <th style="text-align:left;padding:8px;border-bottom:2px solid #ddd;">Resource Bars</th>
                        <th style="text-align:left;padding:8px;border-bottom:2px solid #ddd;">Status</th>
                        <th style="text-align:left;padding:8px;border-bottom:2px solid #ddd;">Ready Pods</th>
                        <th style="text-align:left;padding:8px;border-bottom:2px solid #ddd;">Pods</th>
                      </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                  </table>
                </body>
                </html>
              `;
            } catch (error) {
              viewer.srcdoc = `
                <!doctype html>
                <html lang="en">
                <head><meta charset="UTF-8" /><title>Pod Status</title></head>
                <body style="font-family:Arial,sans-serif;padding:16px;">
                  <h2 style="margin-top:0;">Pod Status</h2>
                  <p style="color:#b42318;font-weight:bold;">Failed to load pod status endpoint.</p>
                </body>
                </html>
              `;
            }
          }

          function openAdminerPreset(preset) {
            const presets = {
              postgres: {
                driver: 'pgsql',
                server: 'postgresql.postgresql.svc.cluster.local',
                username: 'camunda',
                db: 'camunda'
              },
              mongo: {
                driver: 'mongo',
                server: 'mongodb.mongodb.svc.cluster.local:27017',
                username: 'admin',
                db: 'admin'
              },
              elasticsearch: {
                driver: '',
                server: '',
                username: '',
                db: ''
              }
            };

            const selected = presets[preset];
            if (!selected) {
              viewer.removeAttribute('srcdoc');
              viewer.src = '/adminer/';
              return;
            }

            if (preset === 'elasticsearch') {
              viewer.srcdoc = `
                <!doctype html>
                <html lang="en">
                <head><meta charset="UTF-8" /><title>Elasticsearch Preset</title></head>
                <body style="font-family:Arial,sans-serif;padding:16px;">
                  <h2 style="margin-top:0;">Elasticsearch Preset</h2>
                  <p>Adminer does not support Elasticsearch as a database driver.</p>
                  <p>Use these direct Elasticsearch endpoints:</p>
                  <ul>
                    <li><a href="/elasticsearch/" target="_self">/elasticsearch/</a></li>
                    <li><a href="/elasticsearch/_cluster/health" target="_self">/elasticsearch/_cluster/health</a></li>
                  </ul>
                </body>
                </html>
              `;
              return;
            }

            viewer.removeAttribute('srcdoc');
            viewer.src = '/adminer/';
            viewer.onload = () => {
              try {
                const iframeDoc = viewer.contentDocument || viewer.contentWindow?.document;
                if (!iframeDoc) {
                  return;
                }
                const form = iframeDoc.querySelector('form');
                if (!form) {
                  return;
                }

                const driverField = form.querySelector("select[name='auth[driver]']");
                const serverField = form.querySelector("input[name='auth[server]']");
                const usernameField = form.querySelector("input[name='auth[username]']");
                const dbField = form.querySelector("input[name='auth[db]']");

                if (driverField) {
                  driverField.value = selected.driver;
                  driverField.dispatchEvent(new Event('change', { bubbles: true }));
                }
                if (serverField) {
                  serverField.value = selected.server;
                }
                if (usernameField) {
                  usernameField.value = selected.username;
                }
                if (dbField) {
