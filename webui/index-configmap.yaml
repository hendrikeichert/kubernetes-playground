          links.forEach((link) => {
            link.addEventListener('click', (event) => {
              event.preventDefault();
              const target = link.getAttribute('data-target');
              setActiveLink(link);
              if (target === '__health__') {
                showHealthDashboard();
                return;
              }
              if (target === '__es_test__') {
                showElasticsearchTest();
                return;
              }
              if (target === '__adminer_pg__') {
                openAdminerPreset('postgres');
                return;
              }
              if (target === '__adminer_mongo__') {
                openAdminerPreset('mongo');
                return;
              }
              if (target === '__adminer_es__') {
                openAdminerPreset('elasticsearch');
                return;
              }
              if (target === '__pod_status__') {
                showPodStatus();
                return;
              }
              if (target === '__config__') {
                showServiceConfiguration();
                return;
              }
              viewer.removeAttribute('srcdoc');
              viewer.src = target;
            });
          });

          if (links.length > 0) {
            setActiveLink(links[0]);
          }
