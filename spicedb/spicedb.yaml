# spicedb-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: spicedb-postgres-secret
  namespace: spicedb
type: Opaque
stringData:
  SPICEDB_DB_USER: spicedb
  SPICEDB_DB_PASSWORD: spicedb
  SPICEDB_GRPC_PRESHARED_KEY: your-secret-key

---
# spicedb-migration.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: spicedb-migration
  namespace: spicedb
spec:
  template:
    spec:
      containers:
      - name: spicedb-migration
        image: authzed/spicedb:latest
        command: ["spicedb", "migrate", "head"]
        env:
        - name: SPICEDB_DATASTORE_ENGINE
          value: "postgres"
        - name: SPICEDB_DB_USER
          valueFrom:
            secretKeyRef:
              name: spicedb-postgres-secret
              key: SPICEDB_DB_USER
        - name: SPICEDB_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: spicedb-postgres-secret
              key: SPICEDB_DB_PASSWORD
        - name: SPICEDB_DATASTORE_CONN_URI
          value: "postgres://$(SPICEDB_DB_USER):$(SPICEDB_DB_PASSWORD)@postgresql.postgresql.svc.cluster.local:5432/spicedb?sslmode=disable"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      restartPolicy: OnFailure
---
# spicedb-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spicedb
  namespace: spicedb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spicedb
  template:
    metadata:
      labels:
        app: spicedb
    spec:
      containers:
      - name: spicedb
        image: authzed/spicedb:latest
        args: ["serve"]
        ports:
        - containerPort: 50051 # gRPC port
        - containerPort: 8443  # HTTP port
        env:
        - name: SPICEDB_GRPC_PRESHARED_KEY
          valueFrom:
            secretKeyRef:
              name: spicedb-postgres-secret
              key: SPICEDB_GRPC_PRESHARED_KEY
        - name: SPICEDB_DATASTORE_ENGINE
          value: "postgres"
        - name: SPICEDB_DB_USER
          valueFrom:
            secretKeyRef:
              name: spicedb-postgres-secret
              key: SPICEDB_DB_USER
        - name: SPICEDB_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: spicedb-postgres-secret
              key: SPICEDB_DB_PASSWORD
        - name: SPICEDB_DATASTORE_CONN_URI
          value: "postgres://$(SPICEDB_DB_USER):$(SPICEDB_DB_PASSWORD)@postgresql.postgresql.svc.cluster.local:5432/spicedb?sslmode=disable"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: spicedb-service
  namespace: spicedb
spec:
  selector:
    app: spicedb
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051

  - name: http
    port: 8443
    targetPort: 8443
  type: ClusterIP

---
# spicedb-ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spicedb-ingress
  namespace: spicedb
spec:
  rules:
  - host: spicedb.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: spicedb-service
            port:
              number: 50051

