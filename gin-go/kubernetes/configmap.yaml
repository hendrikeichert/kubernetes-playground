apiVersion: v1
kind: ConfigMap
metadata:
  name: my-gin-app-config
data:
  QUARKUS_HTTP_PORT: "8080"
  QUARKUS_PROFILE: "dev"
  QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgres-service:5432/mydb"
  QUARKUS_DATASOURCE_QUERY: "SELECT id, name, email FROM users"
  QUARKUS_MONGODB_DATABASE: "mydb"