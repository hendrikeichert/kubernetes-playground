# otel-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  otel-collector-config.yaml: |
    receivers:
      hostmetrics:
        collection_interval: 10s
        scrapers:
          cpu:
          memory:
          disk:
          network:
    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: otel
    service:
      pipelines:
        metrics:
          receivers: [hostmetrics]
          exporters: [prometheus]
---
# otel-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
spec:
  selector:
    app: otel-collector
  ports:
  - name: prometheus
    port: 8889
    targetPort: 8889
  type: ClusterIP
---
# otel-deployment.yaml
# otel-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector:latest
        command:
          - "/otelcol"
          - "--config=/conf/otel-collector-config.yaml"
        volumeMounts:
        - name: otel-config
          mountPath: /conf
        ports:
        - containerPort: 8889
          name: prometheus
      volumes:
      - name: otel-config
        configMap:
          name: otel-collector-config
          items:
          - key: otel-collector-config.yaml
            path: otel-collector-config.yaml